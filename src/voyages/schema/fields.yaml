# Generated once by a bootstrap script on 2026-10-19, then maintained by hand.
version: 1
description: 'Field registry for the voyages library. Authoritative: every Parquet column is described
  here first. `name` is the column in voyages_wide and the identifier used by the API; `table` and `long`
  say where the value lands in the normalized tables. `label` is in project language; `source_label` keeps
  the original SPSS label verbatim. See docs/schema.md.'
tables:
  voyages:
    grain: one row per voyage
    description: Scalar voyage fields from both voyage datasets
    key:
    - voyage_id
    columns:
    - name: voyage_id
      dtype: int32
      description: Voyage ID (unique across both voyage datasets)
    - name: dataset
      dtype: string
      description: transatlantic | intraamerican
    - from_fields: voyages
  voyage_places:
    grain: one row per voyage, role, sequence, level and provenance
    description: Every place, region and broad region a voyage records, by role. Region codes are kept
      as recorded, not recomputed from place codes (codebook p.30).
    key:
    - voyage_id
    - role
    - seq
    - level
    - provenance
    columns:
    - name: voyage_id
      dtype: int32
      description: Voyage ID (unique across both voyage datasets)
    - name: dataset
      dtype: string
      description: transatlantic | intraamerican
    - name: role
      dtype: string
      description: departure | intended_embarkation | purchase | principal_purchase | call_before_crossing
        | intended_landing | landing | principal_landing | return | construction | registration
    - name: seq
      dtype: int8
      description: 1-3 for roles with several places, else 1
    - name: level
      dtype: string
      description: place | region | broad_region
    - name: code
      dtype: int32
      description: Code in the places reference table
    - name: provenance
      dtype: string
      description: recorded | imputed | derived, from the field registry
    - name: spss_name
      dtype: string
      description: SPSS variable this value came from
  voyage_dates:
    grain: one row per voyage and event
    description: Event dates. Parts stay separate because partial dates are common.
    key:
    - voyage_id
    - event
    columns:
    - name: voyage_id
      dtype: int32
      description: Voyage ID (unique across both voyage datasets)
    - name: dataset
      dtype: string
      description: transatlantic | intraamerican
    - name: event
      dtype: string
      description: departure | purchase_began | left_africa | first_landing | second_landing | third_landing
        | left_last_landing | completed
    - name: year
      dtype: int16
      description: Year, as recorded
    - name: month
      dtype: int8
      description: Month, as recorded
    - name: day
      dtype: int8
      description: Day, as recorded
    - name: date
      dtype: date32
      description: Full date, only when the source has one
  voyage_people_counts:
    grain: one row per voyage, stage, category and provenance
    description: Numbers of people by stage of the voyage and by age/sex category
    key:
    - voyage_id
    - stage
    - category
    - provenance
    columns:
    - name: voyage_id
      dtype: int32
      description: Voyage ID (unique across both voyage datasets)
    - name: dataset
      dtype: string
      description: transatlantic | intraamerican
    - name: stage
      dtype: string
      description: embarked_first_port | died_middle_passage | landed_first_place | embarked_second_port
        | embarked_third_port | landed_second_place | departure_or_arrival
    - name: category
      dtype: string
      description: men | women | boys | girls | infants | adults | children | males | females | *_sex_unspecified
        | *_age_unspecified | captives_identified_by_*
    - name: count
      dtype: int32
      description: Number of people
    - name: provenance
      dtype: string
      description: recorded | imputed | derived, from the field registry
    - name: spss_name
      dtype: string
      description: SPSS variable this value came from
  voyage_people_shares:
    grain: one row per voyage, stage and category
    description: Shares (0-1) by age/sex category as given in the source
    key:
    - voyage_id
    - stage
    - category
    columns:
    - name: voyage_id
      dtype: int32
      description: Voyage ID (unique across both voyage datasets)
    - name: dataset
      dtype: string
      description: transatlantic | intraamerican
    - name: stage
      dtype: string
      description: embarked_first_port | landed_first_place | departure_or_arrival
    - name: category
      dtype: string
      description: men | women | boys | girls | males | children
    - name: share
      dtype: float64
      description: Share of identified people, 0-1
    - name: provenance
      dtype: string
      description: recorded | imputed | derived, from the field registry
    - name: spss_name
      dtype: string
      description: SPSS variable this value came from
  voyage_crew:
    grain: one row per voyage, measure and stage
    description: Crew numbers, deaths and desertions
    key:
    - voyage_id
    - measure
    - stage
    columns:
    - name: voyage_id
      dtype: int32
      description: Voyage ID (unique across both voyage datasets)
    - name: dataset
      dtype: string
      description: transatlantic | intraamerican
    - name: measure
      dtype: string
      description: on_board | died | deserted
    - name: stage
      dtype: string
      description: Stage of the voyage
    - name: count
      dtype: int32
      description: Number of crew
    - name: spss_name
      dtype: string
      description: SPSS variable this value came from
  voyage_sources:
    grain: one row per voyage and source
    description: Source references as written in the database
    key:
    - voyage_id
    - seq
    columns:
    - name: voyage_id
      dtype: int32
      description: Voyage ID (unique across both voyage datasets)
    - name: dataset
      dtype: string
      description: transatlantic | intraamerican
    - name: seq
      dtype: int8
      description: Order in the source columns (A=1)
    - name: reference
      dtype: string
      description: Source reference text, verbatim
  voyage_enslavers:
    grain: one row per voyage, role and name
    description: Ship owners and captains as named in the source. No de-duplication.
    key:
    - voyage_id
    - role
    - seq
    columns:
    - name: voyage_id
      dtype: int32
      description: Voyage ID (unique across both voyage datasets)
    - name: dataset
      dtype: string
      description: transatlantic | intraamerican
    - name: role
      dtype: string
      description: owner | captain
    - name: seq
      dtype: int8
      description: Order in the source columns (A=1)
    - name: name
      dtype: string
      description: Name, verbatim
  estimates:
    grain: one row per year, national carrier and route
    description: 2010 Estimates database. Whole table CC BY-NC 4.0.
    key: null
    columns:
    - from_fields: estimates
  voyages_wide:
    grain: one row per voyage
    description: 'Convenience table: every voyage field as a column named by `name`, plus decoded *_name
      columns for coded fields'
    key:
    - voyage_id
    columns:
    - name: voyage_id
      dtype: int32
      description: Voyage ID (unique across both voyage datasets)
    - name: dataset
      dtype: string
      description: transatlantic | intraamerican
    - from_fields: all voyage tables
dropped:
- spss_name: FILTER_$
  reason: SPSS filter left in the file (label is a filter expression), not data
- spss_name: INTRAAMER
  reason: Constant 1 in the Intra-American file; replaced by the `dataset` column
