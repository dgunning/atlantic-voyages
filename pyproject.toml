[project]
name = "voyages"
version = "0.1.0"
description = "Python library for the SlaveVoyages databases: reproducible ingest, provenance-aware schema, DuckDB query layer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Dwight Gunning" },
]
requires-python = ">=3.11"
keywords = ["slavevoyages", "trans-atlantic slave trade", "history", "duckdb", "parquet"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Sociology :: History",
]
dependencies = [
    "pyreadstat>=1.2",
    "pyarrow>=16",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]

[project.scripts]
voyages = "voyages.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fulldata: needs the full raw downloads (set VOYAGES_DATA_DIR); skipped by default",
]
